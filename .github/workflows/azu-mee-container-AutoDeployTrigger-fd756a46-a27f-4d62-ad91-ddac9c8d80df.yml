name: Trigger auto deployment for azu-mee-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/azu-mee-container-AutoDeployTrigger-fd756a46-a27f-4d62-ad91-ddac9c8d80df.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUMEECONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUMEECONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUMEECONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.AZUMEECONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AZUMEECONTAINER_REGISTRY_PASSWORD }}
          containerAppName: azu-mee-container
          resourceGroup: meechain-vm1_group
          imageToBuild: meechainv02/azu-mee-container:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


